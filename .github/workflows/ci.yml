name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: maritime_user
          POSTGRES_PASSWORD: maritime_secure_dev_password
          POSTGRES_DB: maritime_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maritime_user -d maritime_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libpq-dev

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir ./backend
          pip install --no-cache-dir pytest pytest-asyncio ruff

      - name: Run Ruff Linting
        run: |
          ruff check backend/app

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://maritime_user:maritime_secure_dev_password@localhost:5432/maritime_ops
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend && alembic upgrade head

      - name: Run Backend Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://maritime_user:maritime_secure_dev_password@localhost:5432/maritime_ops
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend && pytest tests/ -v

  frontend:
    name: Frontend Vitest & TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend && npm ci

      - name: Run Vitest Unit Tests
        run: |
          cd frontend && npm test -- --run

      - name: Run TypeScript & Vite Production Build
        run: |
          cd frontend && npm run build
